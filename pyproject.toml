[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "headroom-token-view"
version = "0.0.1"
description = "Drop-in LLM proxy and dashboard that tracks exact token usage and cost across Claude, OpenAI, Gemini, and any LiteLLM-supported provider."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Tejas Chopra", email = "chopratejas@gmail.com" }]
keywords = ["llm", "proxy", "tokens", "cost", "anthropic", "openai", "gemini", "litellm", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # LiteLLM is the proxy engine. Soft-pinned within the 1.x line so users
    # automatically pick up new model support and fixes, but a future 2.0
    # major (which is allowed to break things) cannot land silently.
    # The real supply-chain hardening is in server.py: we set
    # LITELLM_LOCAL_MODEL_COST_MAP=True so prices come from the wheel,
    # not a runtime GitHub fetch (the 2026-01-27 incident vector).
    "litellm[proxy]>=1.86.1,<2.0.0",

    # Web framework. FastAPI is sub-1.0; cap at <1.0 to be conservative.
    "fastapi>=0.124.4,<1.0.0",
    "uvicorn[standard]>=0.33.0,<1.0.0",

    # Other deps: bounded to the next major.
    "click>=8.1,<9.0",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.14,<3.0",
    "pyyaml>=6.0,<7.0",
    "aiosqlite>=0.20,<1.0",
    "httpx>=0.27,<1.0",
    "structlog>=24.1,<26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
htv = "headroom_token_view.cli:main"
headroom-token-view = "headroom_token_view.cli:main"

[project.urls]
Homepage = "https://github.com/chopratejas/headroom-token-view"
Repository = "https://github.com/chopratejas/headroom-token-view"

[tool.hatch.build.targets.wheel]
packages = ["src/headroom_token_view"]

[tool.hatch.build.targets.wheel.force-include]
# Bundle the SvelteKit build into the wheel so `pipx install` ships
# the dashboard. Build it with `cd web && npm install && npm run build`
# before `python -m build` / `pipx install`.
"web/build" = "headroom_token_view/_web"

[tool.hatch.build.targets.sdist]
include = ["src/", "web/", "docs/", "README.md", "pyproject.toml"]
exclude = ["web/node_modules/", "web/.svelte-kit/"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length is enforced softly

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
